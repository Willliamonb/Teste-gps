<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Teste GPS em Tempo Real</title>

    <link rel="stylesheet" href="style.css">

    <script
        src="AIzaSyBK4FPzPkMoj22PiZUyDLrCjoEaFg1DWKk"
        defer>
    </script>

    <script src="script.js" defer></script>

</head>

<body>

    <header>

        <h1>🚚 Rastreamento em Tempo Real</h1>

    </header>

    <main>

        <div id="map"></div>

        <section class="painel">

            <h2>Informações</h2>

            <p>Latitude</p>
            <span id="lat">-</span>

            <p>Longitude</p>
            <span id="lng">-</span>

            <p>Velocidade</p>
            <span id="vel">0 km/h</span>

            <p>Distância Percorrida</p>
            <span id="dist">0 m</span>

            <p>Precisão</p>
            <span id="prec">-</span>

        </section>

    </main>

</body>

</html>
