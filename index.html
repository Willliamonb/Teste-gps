<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Entrega Inteligente GPS</title>

<link rel="stylesheet" href="style.css">


<link 
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

</head>


<body>


<header>

<h1>🚚 Entrega Inteligente</h1>

</header>



<div class="controle">

<input 
id="endereco"
placeholder="Digite o endereço do cliente"
/>


<button onclick="buscarEndereco()">
Calcular Rota
</button>


</div>




<div id="map"></div>




<section class="painel">


<h2>Status da entrega</h2>


<p>Destino:</p>

<span id="destino">
Nenhum
</span>



<p>Latitude:</p>

<span id="lat">
-
</span>



<p>Longitude:</p>

<span id="lng">
-
</span>



<p>Velocidade:</p>

<span id="vel">
0 km/h
</span>



<p>Distância:</p>

<span id="dist">
-
</span>



</section>





<script 
src="https://unpkg.com/leaflet/dist/leaflet.js">
</script>


<script src="script.js"></script>


</body>

</html>
